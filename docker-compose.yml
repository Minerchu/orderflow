# ---------------------------------------------------------------------------
# OrderFlow — Telegram Order Management & Settlement System
#
#   frontend (nginx :80)  ->  backend (uvicorn :8000)  ->  db (postgres :5432)
#
# Quick start:
#   cp .env.example .env      # then edit the secrets
#   docker compose up -d --build
#   docker compose exec backend python -m app.cli init-admin \
#       --username admin --password '<your-strong-password>'
#
# Or use ./scripts/deploy.sh which does all of the above.
# ---------------------------------------------------------------------------

name: orderflow

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orderflow}
      POSTGRES_USER: ${POSTGRES_USER:-orderflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Keep collation predictable across hosts.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orderflow} -d ${POSTGRES_DB:-orderflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - orderflow
    # Not published by default: only the backend needs to reach it.
    # Uncomment to inspect with a local client.
    # ports:
    #   - "127.0.0.1:5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # ---- App ----
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      # Group buttons only work if Telegram knows this public URL.
      # Auto-register the callback webhook on startup.
      AUTO_REGISTER_WEBHOOK: ${AUTO_REGISTER_WEBHOOK:-true}
      # ---- Database ----
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-orderflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-orderflow}
      # ---- Telegram ----
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      ADMIN_TELEGRAM_USER_IDS: ${ADMIN_TELEGRAM_USER_IDS:-}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      TELEGRAM_DRY_RUN: "false"
      # ---- i18n & currency ----
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-INR}
      SUPPORTED_CURRENCIES: ${SUPPORTED_CURRENCIES:-INR,USD}
      TELEGRAM_MESSAGE_LANGUAGE: ${TELEGRAM_MESSAGE_LANGUAGE:-en}
      # ---- Group display ----
      SHOW_ORDER_ID_IN_GROUP: ${SHOW_ORDER_ID_IN_GROUP:-false}
      SHOW_CREDENTIALS_IN_GROUP: ${SHOW_CREDENTIALS_IN_GROUP:-true}
      SHOW_PASSWORD_IN_GROUP: ${SHOW_PASSWORD_IN_GROUP:-true}
      # ---- Group permissions ----
      ALLOW_ANY_GROUP_MEMBER_TO_COMPLETE: ${ALLOW_ANY_GROUP_MEMBER_TO_COMPLETE:-false}
      ALLOW_ANY_GROUP_MEMBER_TO_FAIL: ${ALLOW_ANY_GROUP_MEMBER_TO_FAIL:-false}
      ALLOW_ANY_GROUP_MEMBER_TO_REOPEN: ${ALLOW_ANY_GROUP_MEMBER_TO_REOPEN:-false}
      ALLOW_ANY_GROUP_MEMBER_TO_CLOSE: ${ALLOW_ANY_GROUP_MEMBER_TO_CLOSE:-false}
      # ---- Storage ----
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_PATH: /data/uploads
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-}
      # ---- Uploads ----
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
    volumes:
      # Persist uploaded screenshots across container rebuilds.
      - uploads:/data/uploads
    networks:
      - orderflow
    # Backend is only reached through the frontend proxy by default.
    # Uncomment to hit the API directly (e.g. for debugging / webhooks).
    # ports:
    #   - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - orderflow

volumes:
  pgdata:
  uploads:

networks:
  orderflow:
    driver: bridge
