# ---------------------------------------------------------------------------
# OrderFlow frontend server block.
#
#   /            -> static SPA bundle (with history-mode fallback)
#   /api/...     -> reverse proxy to the backend container
#   /healthz     -> container health endpoint
#
# `backend` is the service name in docker-compose.yml, resolvable on the
# compose network. Override with the BACKEND_UPSTREAM env var if needed by
# templating this file (kept static here for simplicity).
# ---------------------------------------------------------------------------
upstream orderflow_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- gzip ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    client_max_body_size 20m;

    # ---- health (used by the container HEALTHCHECK) ----
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- Telegram callback webhook ----
    # Button taps must get an answer immediately, so this endpoint gets its own
    # tight timeouts and no gzip: if the origin ever takes longer than ~30s the
    # request has already failed upstream (Telegram waits 60s, Cloudflare 100s)
    # and keeping the connection open only worsens the backlog.
    location = /api/telegram/webhook {
        gzip off;
        proxy_pass http://orderflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ---- API reverse proxy ----
    location /api/ {
        proxy_pass http://orderflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # Uploads can be slow on mobile networks.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- hashed build assets: safe to cache forever ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA history-mode fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or clients keep an old bundle shell.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
    }
}
